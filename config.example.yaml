# Copy to config.yaml (git-ignored), then configure locally.
email:
  imap_server: imap.qiye.aliyun.com
  imap_port: 993
  address: ''
  password: ''
  mailbox: INBOX
  audit_addresses: []
  connect_timeout: 30
  connect_retries: 3
  cache_enabled: false
  cache_dir: cache/mails
field_extraction:
  # Optional local aliases for one agency; use a real mapping only in ignored config.yaml.
  agent_aliases: {}
workorder:
  url: 'https://mp.ecopv-epr.com/system/user'
  username: ''
  password: ''
  # 无头运行：复用 storage/login_state.json 里的登录态直接进系统，不再每次弹窗等人工输验证码。
  # 登录态缺失/过期时会按 headless_fallback_to_headed 临时弹一次有头窗口让人输验证码，
  # 成功后自动落盘并切回无头。首次使用或 cookie 失效时才会看到浏览器窗口。
  headless: true
  headless_fallback_to_headed: true
  browser_channel: msedge
  timeout: 30
  date_window_months: 1
  customer_threshold: 85
  query_interval_seconds: 3
  query_cache_path: storage/query_cache.json
  login_state_path: storage/login_state.json
  agent_aliases: {}
  selectors: {}
llm:
  enabled: true
  api_key_env: DEEPSEEK_API_KEY
  api_key: ''
  base_url: https://api.deepseek.com
  model: deepseek-chat
  timeout: 60
  max_tokens: 4096
  temperature: 0.1
  semantic_batch_size: 6
  audit_log_path: logs/llm_calls.jsonl
reference_tables:
  internal_emails: data/internal_emails.xlsx
  agent_emails: data/agent_emails.xlsx
  project_names: data/project_names.xlsx
output:
  dir: output
  categorized: true
logging:
  dir: logs
  level: INFO
ocr:
  fallback: true
crm_api:
  # 业务系统开放平台（替代阶段二浏览器 RPA）。
  # enabled=true 后，阶段二优先走 API；取不到 token 时仍可回退到浏览器模式。
  enabled: false
  # 环境：prod / test
  env: prod
  # clientKey / clientSecret **不写在这里**：由 utils/import_openapi_cred.py
  # 导入到下面这个 DPAPI 密文文件（绑定本机 Windows 账户，拷走也解不开）。
  credential_file: storage/openapi.cred
  timeout: 30
  # 签名模式：raw=Base64(SHA256 原始字节)，hex=Base64(SHA256 十六进制串)。
  # 若取 token 报签名错误，改成 hex 再试。
  sign_mode: raw
  profiles:
    prod:
      base_url: 'https://mp.ecopv-epr.com/api'
      client_id: ''
    test:
      base_url: 'https://test.ecopv-epr.com/api'
      client_id: ''
