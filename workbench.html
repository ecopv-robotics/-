  <style>
    .field select{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px;font:inherit;outline:none;background:#fff;color:var(--ink)}
    /* 工作台桌面布局：整页锁定在一个视口内，各内容区独立滚动。 */
    html,body{height:100%;overflow:hidden}
    .shell{width:100%;max-width:none;height:100vh;min-height:0;grid-template-columns:210px minmax(0,1fr);overflow:hidden}
    .main{width:100%;height:100vh;min-height:0;display:flex;flex-direction:column}
    .top{height:68px;min-height:68px;flex:0 0 68px;padding:0 24px}
    h1{font-size:21px}
    /* 旧规则遗留的 margin:auto 会使 flex 子项按内容宽度居中，从而在左右
       留下大块白边。工作台应占满左侧导航以外的全部可用区域；仅保留内容内边距。 */
    .container{width:100%;max-width:none;margin:0;align-self:stretch;height:auto;min-height:0;flex:1;overflow:hidden;display:flex;flex-direction:column;padding:14px 24px 16px}
    /* 顶部说明横条不再占用工作区高度；统计摘要直接贴近页面顶部。 */
    .banner{display:none}
    .stats{grid-template-columns:repeat(7,minmax(110px,1fr));gap:8px;margin:0 0 8px}
    @media(max-width:1200px){.stats{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:780px){.stats{grid-template-columns:repeat(2,1fr)}}
    .stat{padding:7px 12px;min-height:58px}
    .stat .num{font-size:21px;line-height:1}
    .stat .label{margin-top:4px;font-size:11px}
    .work{height:0;min-height:0;flex:1;overflow:hidden}
    /* 业务明细与证据面板互换：证据固定在左侧，业务明细占右侧弹性空间。 */
    @media(min-width:1201px){
      /* 左侧未完成邮件只承担导航，压缩其宽度；中间字段证据需要同时
         展示正文、附件名称和表格预览，给它更多弹性空间。右侧业务明细
         保留足够宽度，避免公司名和项目名被过度折行。 */
      .work{grid-template-columns:minmax(250px,.55fr) minmax(480px,1.25fr) minmax(460px,1.35fr)}
      .evidence{grid-column:2;grid-row:1}
      .detail{grid-column:3;grid-row:1}
    }
    @media (max-width:1200px) and (min-width:781px){
      .work{grid-template-columns:245px minmax(300px,.85fr) minmax(360px,1fr)}
      .evidence{grid-column:2;grid-row:1}
      .detail{grid-column:3;grid-row:1}
    }
    .queue,.detail,.evidence{min-height:0}
    .date-tools{display:flex;align-items:center;gap:6px;margin-top:8px;color:var(--muted);font-size:11px}.date-tools label{white-space:nowrap}.date-tools input{min-width:0;flex:1;border:1px solid var(--line);border-radius:5px;padding:6px 7px;color:var(--ink);font:inherit;background:#fff}.date-tools .btn{padding:5px 8px;font-size:11px}

    .queue-list::-webkit-scrollbar-thumb,.detail-body::-webkit-scrollbar-thumb,.evidence::-webkit-scrollbar-thumb{background:#8ba9b1;border:2px solid #edf3f5;border-radius:8px}

    .queue-extra{display:flex;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden}.queue-extra span{overflow:hidden;text-overflow:ellipsis}

    /* 业务明细采用询单队列式单列纵向浏览，避免多列卡片在窄屏中互相挤压。 */

    .business .card-foot{margin-top:5px;padding-top:5px}
    .evidence-hit{color:#b42318;background:#ffe4e1;border-radius:3px;padding:0 2px;font-weight:700}

  <style id="layout-viewport-floor">
    /* 最终布局覆盖（2026-10-16）：必须放在所有旧样式之后。
       目的——把主工作区在垂直方向给足（下限 --work-min-h），窗口装不下时整页上下滚动，
       而不是把三栏压扁；导航与顶栏在整页滚动时钉住，保证刷新/导出/日期随时可用。
       三栏各自内部滚动的手感必须保留，所以 .work 仍然 overflow:hidden。
       调高度只改 --work-min-h 这一个值即可：
         93vh    = 主工作区比「铺满视口」再高约 1/3（默认，参考 1080p：750px → 1004px）
         620px   = 只在矮窗口兜底，高分辨率下与改动前完全一致（回退用）
         100vh   = 极端放大 */
    :root{--work-min-h:max(620px,93vh)}
    /* overflow 只能加在 html 上：一旦 body 也有非 visible 的 overflow，body 自己会变成滚动容器，
       里面的 position:sticky 就会锚在 body 上（而 body 并不滚动），导航和顶栏会失效。 */
    html{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto}
    body{height:auto;min-height:100%;overflow:visible}
    .shell{height:auto!important;min-height:100vh;overflow:visible!important}
    /* .main 必须用 min-height 而不是固定 height：一旦写死 100vh，.shell 的网格行高就被钉在视口高，
       而 .container 的内容会溢出到行外（不进网格行高），于是 .side 的可移动余量恒为 0，
       position:sticky 无处可动 —— 实测导航在整页滚动时被原样带走。
       改成 min-height 后，行高 = 内容真实高度（矮窗口下由 .work 的 min-height 顶起），
       余量 = 行高 - 100vh = 需要滚动的距离，导航才钉得住。 */
    .main{height:auto!important;min-height:100vh;overflow:visible!important}
    /* overflow 必须放开，否则 flex 撑出来的空间无法交给页面滚动。 */
    .container{height:auto!important;overflow:visible!important}
    /* height:0 + flex:1 是「吃满剩余空间」的经典写法，必须保留；
       min-height 只负责矮窗口下不被压扁。overflow:hidden 保证三栏各自内部滚动的手感。 */
    .work{height:0!important;flex:1 1 0;min-height:var(--work-min-h)!important;overflow:hidden!important}
    /* sticky 要求祖先链上没有 overflow:hidden，上面的覆盖已经保证这一点。
       align-self:start 让导航不随行高拉伸，sticky 才有可移动的余量。 */
    .side{position:sticky!important;top:0!important;height:100vh;align-self:start;z-index:6}
    /* 顶栏钉住：否则整页滚动时刷新/导出/日期控件会被滚出视野。 */
    .top{position:sticky;top:0;z-index:5;box-shadow:0 1px 0 0 var(--line)}
    @media(max-width:1100px){
      /* 这个断点本来就是「纵向长页」：队列+详情占第 1 行、证据面板占第 2 行，
         三块各自是显式高度（610 / 610 / 620），由整页滚动承载。
         这里必须把 height / min-height / overflow / flex 原样交还给长页模式：
         · 少了 height:auto + overflow:visible → 第 2 行的证据面板被 overflow:hidden 整块裁掉；
         · 少了 flex:none → .container 是 flex column 容器，.work 的 flex:1 1 0 会按
           「可分配剩余」而不是内容高算，实测工作区从 1242px 塌成 522px（内容全部溢出）。
         实测 1100/1024/900/781/780/680/390 都会中招，故四项必须一起还原。 */
      .work{height:auto!important;min-height:0!important;overflow:visible!important;flex:none!important}
    }
    @media(max-width:780px){
      /* 窄屏导航改为普通文档流，钉住反而挡住内容。 */
      .side{position:static!important;height:auto}
      .top{position:static}
    }
  </style>

<script>
  const API_BASE=location.protocol==='file:'?'http://127.0.0.1:8765':'';
  const app={data:null,view:'inbox',filter:'all',search:'',fCountry:'',fProgram:'',fStatus:'',fAgent:'',fCustomer:'',dateStart:'',dateEnd:'',mailId:null,detailId:null,tab:'details',highlightField:null,detailOrder:{},selectedMailIds:new Set(),stateFromCache:false,serverOffline:false,backgroundRefreshTimer:null,pendingActionButton:null};

  const $=s=>document.querySelector(s); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const statusLabel=s=>({review:'待人工复核',ready:'待确认',partial:'部分确认',confirmed:'已确认',returned:'已退回',needs_info:'待补资料'}[s]||s||'未判定');
  const statusClass=s=>s||'review';
  function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  function newRequestId(){try{return crypto.randomUUID()}catch(_){return `req_${Date.now()}_${Math.random().toString(16).slice(2)}`}}
  async function api(url,opt={},settings={}){
    const method=String(opt.method||'GET').toUpperCase();
    const headers=new Headers(opt.headers||{});
    let body=opt.body;
    let requestId='';
    if(method!=='GET'){
      let payload={};
      try{payload=body?JSON.parse(body):{}}catch(_){payload={}}

  function bindSplitters(){
    const work=document.querySelector('.work'),shell=document.querySelector('.shell');if(!work)return;
    const storageKey='ecopv-workbench-splitters-v3';let saved={};
    try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')||{}}catch(_){}
    let queue=Number.isFinite(saved.queue)?saved.queue:250,evidence=Number.isFinite(saved.evidence)?saved.evidence:480;
    const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
    const apply=()=>{
      if(window.innerWidth<=1100)return;
      const budget=work.clientWidth-320;
      const q=clamp(queue,220,Math.min(520,budget-320));
      const e=clamp(evidence,320,Math.min(820,budget-q));
      work.style.setProperty('--queue-w',q+'px');work.style.setProperty('--evidence-w',e+'px');
      document.querySelectorAll('.splitter').forEach(node=>{node.setAttribute('aria-valuenow',String(Math.round(node.dataset.splitter==='queue'?q:e)));node.setAttribute('aria-orientation','vertical')});
    };
    const persist=()=>{try{localStorage.setItem(storageKey,JSON.stringify({queue,evidence}))}catch(_){}};
    const width=type=>parseFloat(getComputedStyle(work).getPropertyValue(type==='queue'?'--queue-w':'--evidence-w'));
    const set=(type,value)=>{
      const budget=work.clientWidth-320;
      if(type==='queue')queue=clamp(value,220,Math.min(520,budget-width('evidence')));
      else evidence=clamp(value,320,Math.min(820,budget-width('queue')));
      apply();
    };
    document.querySelectorAll('.splitter').forEach(splitter=>{
      let drag=null;
      splitter.onpointerdown=e=>{
        if(e.button!==0||window.innerWidth<=1100)return;e.preventDefault();
        drag={id:e.pointerId,x:e.clientX,value:width(splitter.dataset.splitter),cursor:document.body.style.cursor,select:document.body.style.userSelect};
        splitter.classList.add('dragging');document.body.style.cursor='col-resize';document.body.style.userSelect='none';splitter.setPointerCapture(e.pointerId);
      };
      splitter.onpointermove=e=>{if(!drag||drag.id!==e.pointerId)return;const type=splitter.dataset.splitter;set(type,drag.value+(e.clientX-drag.x)*(type==='queue'?1:-1))};
      const end=e=>{if(!drag||drag.id!==e.pointerId)return;document.body.style.cursor=drag.cursor;document.body.style.userSelect=drag.select;drag=null;splitter.classList.remove('dragging');persist()};
      splitter.onpointerup=end;splitter.onpointercancel=end;splitter.onlostpointercapture=end;
      splitter.onkeydown=e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const type=splitter.dataset.splitter;set(type,width(type)+(e.key==='ArrowRight'?20:-20)*(type==='queue'?1:-1));persist()};
      splitter.ondblclick=()=>{queue=250;evidence=480;apply();persist()};
    });
    try{shell.classList.toggle('nav-expanded',localStorage.getItem('ecopv-workbench-nav-expanded')==='true')}catch(_){}
    const updateNav=()=>{const expanded=shell.classList.contains('nav-expanded'),button=$('#nav-toggle');button.textContent=expanded?'«':'»';button.title=expanded?'收起导航':'展开导航';button.setAttribute('aria-label',button.title);button.setAttribute('aria-expanded',String(expanded));apply()};
    $('#nav-toggle').onclick=()=>{shell.classList.toggle('nav-expanded');try{localStorage.setItem('ecopv-workbench-nav-expanded',String(shell.classList.contains('nav-expanded')))}catch(_){}updateNav()};
    new ResizeObserver(apply).observe(work);window.addEventListener('resize',apply);updateNav();
  }

    for(const file of files){

  }
  const _queueMailsBeforeDimFilter=queueMails;
  queueMails=function(){return (_queueMailsBeforeDimFilter()||[]).map(dimProjectMail).filter(Boolean)};
  function projectRows(){
    const rows=(app.data&&app.data.projects)||[];
    return (Array.isArray(rows)?rows:[]).filter(row=>row&&typeof row==='object'&&row.name);
  }
  function queueDetailStats(){
    const details=(app.data?.mails||[]).flatMap(m=>m.details||[]);
    const programHits=new Map(),countryHits=new Map();
    details.forEach(detail=>{
      const fields=(detail&&detail.fields)||{};
      const program=String(fields.program||'').trim();
      const country=String(fields.country||'').trim();
      if(program)programHits.set(program,(programHits.get(program)||0)+1);
      if(country)countryHits.set(country,(countryHits.get(country)||0)+1);
    });
    return {programHits,countryHits};
  }
  function namedOption(name,count){
    return `<option value="${esc(name)}">${esc(name)}${count?`（${count} 条）`:''}</option>`;
  }
  // 国家全集与项目全集都取自「项目名称表」，该表重新导入后下拉随之变化；
  // 批次里出现、但项目表暂无的国家只在末尾兜底补上，避免漏筛。
  let _filterOptionsSignature='';
  function buildFilterOptions(){
    if(!app.data)return;
    const rows=projectRows();
    const stats=queueDetailStats();
    const programHits=stats.programHits,countryHits=stats.countryHits;
    const countries=[],tableNames=[],tableNameSet=new Set();
    rows.forEach(row=>{
      const name=String(row.name||'').trim();
      const country=String(row.country||'').trim();
      if(name){tableNames.push(name);tableNameSet.add(name)}
      if(country&&countries.indexOf(country)<0)countries.push(country);
    });
    [...countryHits.keys()].forEach(country=>{if(countries.indexOf(country)<0)countries.push(country)});
    const signature=JSON.stringify([
      countries,
      countries.map(country=>countryHits.get(country)||0),
      rows.map(row=>String(row.name||'')+'\u0001'+String(row.country||'')),
      [...programHits],
      app.fCountry,
    ]);
    if(signature===_filterOptionsSignature)return;
    _filterOptionsSignature=signature;
    const countrySel=document.getElementById('f-country-sel');
    if(countrySel)countrySel.innerHTML='<option value="">全部国家</option>'
      +countries.map(country=>namedOption(country,countryHits.get(country)||0)).join('');
    const programSel=document.getElementById('f-program-sel');
    if(programSel){
      if(app.fCountry){
        // 选定国家后，项目下拉只保留项目名称表里属于该国的项目
        const own=rows.filter(row=>String(row.country||'').trim()===app.fCountry);
        programSel.innerHTML='<option value="">全部项目</option>'
          +own.map(row=>namedOption(row.name,programHits.get(String(row.name||'').trim())||0)).join('')
          +(own.length?'':'<option value="" disabled>项目名称表中暂无该国项目</option>');
      }else{
        const queued=tableNames.filter(name=>programHits.has(name))
          .concat([...programHits.keys()].filter(name=>!tableNameSet.has(name)));
        const rest=tableNames.filter(name=>!programHits.has(name));
        programSel.innerHTML='<option value="">全部项目</option>'
          +(queued.length?`<optgroup label="当前队列出现">${queued.map(name=>namedOption(name,programHits.get(name)||0)).join('')}</optgroup>`:'')
          +(rest.length?`<optgroup label="项目名称表其余">${rest.map(name=>`<option value="${esc(name)}">${esc(name)}</option>`).join('')}</optgroup>`:'');
      }
    }
  }
  // 项目名称表重新导入后，旧的「国家 + 项目」组合可能已经不成立。
  // 这里只做纯数据校验，且必须早于任何渲染，否则会出现「队列按旧值渲染、汇总按新值统计」的错位。
  function pruneDimFilter(){
    const rows=projectRows();
    if(!rows.length)return;              // 项目表不可用时不做任何推断，避免误清用户的选择
    const countrySet=new Set(),programOwner=new Map();
    rows.forEach(row=>{
      const name=String(row.name||'').trim();
      const country=String(row.country||'').trim();
      if(country)countrySet.add(country);
      if(name)programOwner.set(name,country);
    });
    if(app.fCountry&&!countrySet.has(app.fCountry))app.fCountry='';
    const owner=programOwner.get(app.fProgram);
    // 项目表里查不到该项目时保留（可能是表还没更新），查得到但归属别国才清空
    if(app.fProgram&&owner!==undefined&&app.fCountry&&owner!==app.fCountry)app.fProgram='';
  }
  function syncFilterInputs(){
    const setSelect=(id,value)=>{const node=document.getElementById(id);const next=value||'';if(node&&node.value!==next)node.value=next};
    setSelect('f-country-sel',app.fCountry);setSelect('f-program-sel',app.fProgram);setSelect('f-status-sel',app.fStatus);
    const agentNode=document.getElementById('f-agent-q');
    if(agentNode&&document.activeElement!==agentNode)agentNode.value=app.fAgent||'';
    const customerNode=document.getElementById('f-customer-q');
    if(customerNode&&document.activeElement!==customerNode)customerNode.value=app.fCustomer||'';
  }
  function renderFilterSummary(){
    const box=document.getElementById('filter-summary'),tags=document.getElementById('filter-tags');
    if(!box)return;
    const mails=queueMails()||[];
    const detailCount=mails.reduce((sum,mail)=>sum+(mail.details||[]).length,0);
    const allMails=(app.data?.mails||[]).length;
    const allDetails=(app.data?.mails||[]).flatMap(m=>m.details||[]).length;
    const chips=[];
    if(app.fCountry)chips.push(['国家',app.fCountry]);
    if(app.fProgram)chips.push(['项目',app.fProgram]);
    if(app.fStatus)chips.push(['状态',statusLabel(app.fStatus)]);
    if(app.fAgent)chips.push(['代理',app.fAgent]);
    if(app.fCustomer)chips.push(['客户',app.fCustomer]);
    box.innerHTML=chips.length
      ? `命中 <b>${mails.length}</b> 封邮件 · <b>${detailCount}</b> 条明细　<span class="muted">（全部 ${allMails} 封 / ${allDetails} 条）</span>`
      : `当前显示 <b>${mails.length}</b> 封邮件 · <b>${detailCount}</b> 条明细`;
    if(tags){
      const german=mails.filter(mail=>isGermanSpecialMail(mail)).length;
      tags.innerHTML=chips.map(pair=>`<span class="filter-tag">${esc(pair[0])}：${esc(pair[1])}</span>`).join('')
        +(german?`<span class="filter-tag">含德国专项 ${german}</span>`:'');
    }
  }
  function renderReconcile(){
    const box=document.getElementById('reconcile');
    if(!box)return;
    const counts=app.data?.counts||{};
    const imap=Number(counts.imap_read_total||0);
    if(!imap){box.style.display='none';box.innerHTML='';return}
    box.style.display='';
    const parsed=Number(counts.imap_parsed_total||0);
    const queued=Number(counts.mails||0);
    const rows=(app.data?.filtered_mails||[]).filter(row=>String(row?.scope||'')!=='业务项目');
    const filteredN=rows.length;
    const gap=imap-(queued+filteredN);
    let internal=0,notice=0,other=0;
    rows.forEach(row=>{
      const reason=String(row?.reason||'');
      if(reason.indexOf('内部发件人')>=0)internal+=1;
      else if(reason.indexOf('证书')>=0||reason.indexOf('下号')>=0)notice+=1;
      else other+=1;
    });
    const summary=app.data?.imap_summary||{};
    const range=[summary.date_from,summary.date_to].filter(Boolean).join('~');
    box.className='reconcile'+(gap!==0?' warn':'');
    box.innerHTML=`<span class="reconcile-title">读取完整性</span>`
      +`<span class="reconcile-chain">${esc(range||'未记录日期')}　IMAP 搜到 <b>${imap}</b> ＝ 解析 <b>${parsed}</b> → 队列 <b>${queued}</b> ＋ 过滤 <b>${filteredN}</b></span>`
      +`<span class="reconcile-gap${gap!==0?' bad':''}">${gap===0?'账目闭合，未发现遗漏':`未归因差额 ${gap} 封，请核对是否读取完整`}</span>`
      +`<span class="reconcile-gap">过滤明细：内部发件人 ${internal} · 下证通知 ${notice} · 其他 ${other}</span>`;
  }
  const _renderBeforeDimFilter=render;
  render=function(){
    pruneDimFilter();
    _renderBeforeDimFilter();
    buildFilterOptions();
    syncFilterInputs();
    renderFilterSummary();
    renderReconcile();
  };
  function applyDimFilter(){
    // 保留上一状态（2026-10-16）：筛选后若原邮件仍在可见队列里，就停在原处，否则才退回队列首封。
    // 原来无条件置 null，会导致「在搜索框里打一个字就丢掉当前正在看的那封邮件」。
    const keepMail=app.mailId,keepDetail=app.detailId;
    app.selectedMailIds.clear();
    const visible=queueMails();
    const kept=keepMail?visible.find(mail=>mail.id===keepMail):null;
    if(kept){
      app.mailId=kept.id;
      const details=kept.details||[];
      app.detailId=details.some(detail=>detail.id===keepDetail)?keepDetail:(details[0]?.id||null);
    }else{
      app.mailId=null;app.detailId=null;
    }
    render();
  }
  function bindFilterBar(){
    const onSelect=(id,key)=>{
      const node=document.getElementById(id);
      if(node)node.onchange=event=>{app[key]=event.target.value;applyDimFilter()};
    };
    const countryNode=document.getElementById('f-country-sel');
    if(countryNode)countryNode.onchange=event=>{
      const next=event.target.value;
      // 项目下拉随国家联动，换国家时旧项目不再成立，一并清空
      if(next!==app.fCountry)app.fProgram='';
      app.fCountry=next;
      applyDimFilter();
    };
    onSelect('f-program-sel','fProgram');
    onSelect('f-status-sel','fStatus');
    const agentNode=document.getElementById('f-agent-q');
    if(agentNode)agentNode.oninput=event=>{app.fAgent=event.target.value;applyDimFilter()};
    const customerNode=document.getElementById('f-customer-q');
    if(customerNode)customerNode.oninput=event=>{app.fCustomer=event.target.value;applyDimFilter()};
    const reset=document.getElementById('filter-reset');
    if(reset)reset.onclick=()=>{
      app.fCountry='';app.fProgram='';app.fStatus='';app.fAgent='';app.fCustomer='';
      app.dateStart='';app.dateEnd='';
      saveDateRange();syncDateInputs();
      applyDimFilter();
    };
  }
  bindFilterBar();

  /* ===== 状态保留层（2026-10-16）=====
     目标：切邮件 / 切明细 / 切标签页 / 开关修正弹窗 / 切换筛选条件时，
           不丢滚动位置与未保存的输入。
     约束：全部内存态——不写 localStorage、不写 workbench.db、不发额外请求。
     位置：放在最后，包住被覆盖过 6 次的最外层 render()，一处生效即可覆盖全部视图。
     ⚠ 恢复必须用 requestAnimationFrame 并带「令牌」守卫：期间若又有新渲染就放弃，
       否则会和 scheduleBackgroundRefresh 抢滚动条。 */
  const stateKeep=(function(){
    const evidenceBox=()=>$('#evidence .source-content')||$('#evidence');
    const detailBody=()=>document.querySelector('#detail .detail-body');
    const queueList=()=>$('#queue-list');
    // 滚动记忆：证据按「邮件+证据标签页」、详情按「邮件+明细」分别记——
    // 换了内容就当新的一页从顶部看，切回来才回到上次的位置。
    const evidenceScroll=new Map(),detailScroll=new Map(),draftByDetail=new Map();
    let pending=null,token=0,quietUntil=0,inRender=0,stickyAnchor=null,lastView=null;
    // stickyAnchor = 用户最后一次「真实滚动队列」时的位置。
    // 它比 render 时的即时锚点更稳：搜索把当前邮件筛掉后，即时锚点会退化成比例回退，
    // 而清空搜索时用 stickyAnchor 才能把用户送回原来的位置。
    const applyAnchor=(q,anchor)=>{
      if(!anchor||!anchor.mailId)return false;
      const node=q.querySelector(`[data-mail="${CSS.escape(String(anchor.mailId))}"]`);
      if(!node)return false;
      const rect=q.getBoundingClientRect();
      q.scrollTop+=node.getBoundingClientRect().top-rect.top-anchor.offset;
      return true;
    };

    const sourceTabKey=()=>document.querySelector('#evidence .source-tabs button.active')?.dataset.sourceTab||'';
    const evidenceKey=()=>app.mailId?`${app.mailId}|${sourceTabKey()}`:null;
    const detailKey=()=>app.detailId?`${app.mailId}|${app.detailId}`:null;

    // 队列锚点用「视口内第一封可见邮件 + 它与列表顶的偏移」，不用绝对 scrollTop：
    // 筛选后列表变短/变长也能定位回同一封，而不是跳回顶部。
    function queueAnchor(){
      const q=queueList();if(!q)return null;
      const rect=q.getBoundingClientRect();
      const node=[...q.querySelectorAll('.mail-item')].find(item=>item.getBoundingClientRect().bottom>rect.top+2);
      const maxTop=Math.max(0,q.scrollHeight-q.clientHeight);
      return {mailId:node?.dataset.mail||null,
        offset:node?node.getBoundingClientRect().top-rect.top:0,
        ratio:maxTop?Math.min(1,Math.max(0,q.scrollTop/maxTop)):0};
    }
    // force=true 用于「点击前」抓拍：此时 document 与 app 仍指向旧邮件，必须抓到。
    function rememberScroll(force){
      if(!force&&performance.now()<quietUntil)return;
      const eb=evidenceBox(),db=detailBody(),ek=evidenceKey(),dk=detailKey();
      if(eb&&ek)evidenceScroll.set(ek,eb.scrollTop);
      if(db&&dk)detailScroll.set(dk,db.scrollTop);
    }
    function capture(){
      const anchor=queueAnchor();
      if(performance.now()>=quietUntil)stickyAnchor=anchor;
      pending={anchor};
    }
    // only='queue' 只恢复队列：搜索框等路径只重建队列，不该去动另外两个面板的滚动。
    function restore(only){
      const snapshot=pending,myToken=token;
      requestAnimationFrame(()=>{
        if(myToken!==token)return;              // 期间又渲染了，让新一轮负责
        quietUntil=performance.now()+160;        // 屏蔽自己这次程序化滚动产生的事件回写
        try{
          const q=queueList();
          if(q&&snapshot?.anchor){
            const anchor=snapshot.anchor;
            // 优先回到用户最后一次滚动的位置；它还在列表里就一定能派上用场。
            const applied=applyAnchor(q,stickyAnchor)||applyAnchor(q,anchor);
            if(applied){if(!stickyAnchor)stickyAnchor=anchor}
            else{
              // 两处锚点都不在列表里（被筛掉或删除）：按比例退回，至少不跳回顶部。
              q.scrollTop=Math.round(Math.max(0,q.scrollHeight-q.clientHeight)*(anchor.ratio||0));
            }
          }
          if(only==='queue')return;
          // 有字段高亮时证据面板交给 focusEvidenceHit 定位，这里不能抢。
          const eb=evidenceBox();
          if(eb&&!(app.tab==='details'&&app.highlightField)){
            const saved=evidenceScroll.get(evidenceKey());
            eb.scrollTop=typeof saved==='number'?saved:0;
          }
          const db=detailBody();
          if(db){
            const saved=detailScroll.get(detailKey());
            db.scrollTop=typeof saved==='number'?saved:0;
          }
        }finally{if(only!=='queue')pending=null}
      });
    }

    // 捕获阶段先抓快照：内联 onclick 会把 app.mailId 改掉，晚一步抓到的就是新邮件的滚动位置。
    document.addEventListener('click',event=>{
      const target=event.target;
      if(!(target instanceof Element))return;
      if(target.closest('[data-select-mail]'))return;      // 勾选复选框不改变正在看的对象
      if(target.closest('#queue-list .mail-item')||target.closest('#detail')){
        rememberScroll(true);
        capture();
      }
    },true);
    // 滚动事件不冒泡，只能靠捕获阶段监听整个文档来收集各面板位置。
    document.addEventListener('scroll',event=>{
      const target=event.target;
      if(!(target instanceof Element))return;
      if(target.id==='queue-list'){
        // 队列：只有用户真实滚动才更新 sticky 锚点（程序化滚动在 quietUntil 窗口内被忽略）。
        if(performance.now()>=quietUntil)stickyAnchor=queueAnchor();
        return;
      }
      if(target.closest?.('#evidence')||target.closest?.('#detail'))rememberScroll(false);
    },true);

    const renderBeforeStateKeep=render;
    render=function(){
      // 换视图（询单复核 / 漏单邮件 / 已过滤邮件）时列表完全换了一批，旧锚点不再有意义。
      if(lastView!==null&&app.view!==lastView)stickyAnchor=null;
      lastView=app.view;
      token+=1;
      if(!pending)capture();
      // 必须在重建「之前」开静默窗口：innerHTML 重置 scrollTop 会触发滚动事件，
      // 若等 restore 的 rAF 才置，那次事件会先把 sticky 锚点写成重建后的位置。
      quietUntil=performance.now()+400;
      inRender+=1;
      try{renderBeforeStateKeep()}finally{inRender-=1}
      restore();
    };
    // 搜索框、全选、清除选择这些路径直接调 renderQueue()，不经过 render()，
    // 必须单独包一层，否则队列滚动位置在过滤/清空时还是会跳。
    const renderQueueBeforeStateKeep=renderQueue;
    renderQueue=function(){
      if(inRender>0){renderQueueBeforeStateKeep();return}   // render() 内部调用，由外层统一负责
      token+=1;
      if(!pending)capture();
      quietUntil=performance.now()+400;
      renderQueueBeforeStateKeep();
      restore('queue');
    };

    /* ---- 修正明细弹窗草稿：只存在内存，永不落库 ---- */
    const MODAL_FIELDS=['company','agent','country','program','request'];
    const readModalFields=()=>Object.fromEntries(MODAL_FIELDS.map(key=>[key,$('#f-'+key)?.value??'']));
    const writeModalFields=fields=>{if(!fields)return;MODAL_FIELDS.forEach(key=>{const node=$('#f-'+key);if(node&&typeof fields[key]==='string')node.value=fields[key]})};
    let modalKey=null,modalTarget=null;
    const draftBadge=document.createElement('span');
    draftBadge.id='modal-draft-note';draftBadge.hidden=true;
    draftBadge.innerHTML='未保存修改 <button type="button" id="modal-draft-drop">丢弃</button>';
    document.querySelector('#modal-overlay .modal-head-copy')?.appendChild(draftBadge);

    const openModalBeforeStateKeep=openModal;
    openModal=function(d,mode='edit'){
      openModalBeforeStateKeep(d,mode);
      const overlay=$('#modal-overlay');
      if(!overlay||!overlay.classList.contains('show'))return;
      modalTarget={d,mode};
      modalKey=d?.id?`${d.id}|${mode}`:null;
      const saved=modalKey?draftByDetail.get(modalKey):null;
      if(saved)writeModalFields(saved.fields);
      draftBadge.hidden=!saved;
      const save=$('#modal-save'),saveBeforeStateKeep=save.onclick;
      // 保存成功时弹窗会被关掉；失败时会留在打开状态并提示「输入内容已保留」，
      // 所以判断依据是「弹窗是否还开着」，不是调用的返回值。
      save.onclick=async event=>{
        await saveBeforeStateKeep.call(save,event);
        if(modalKey&&!overlay.classList.contains('show'))draftByDetail.delete(modalKey);
      };
    };
    document.addEventListener('input',event=>{
      const overlay=$('#modal-overlay');
      if(!modalKey||!overlay||!overlay.classList.contains('show'))return;
      if(!event.target.closest?.('#modal-overlay .modal-body'))return;
      draftByDetail.set(modalKey,{fields:readModalFields(),at:new Date().toISOString()});
      draftBadge.hidden=false;
    },true);
    document.getElementById('modal-draft-drop')?.addEventListener('click',()=>{
      if(modalKey)draftByDetail.delete(modalKey);
      const target=modalTarget;
      if(target)openModal(target.d,target.mode);          // 重新按源数据填充
      else draftBadge.hidden=true;
      toast('已丢弃未保存的修改');
    });

    return {evidenceScroll,detailScroll,draftByDetail,capture,rememberScroll:()=>rememberScroll(true)};
  })();

  load();
</script>
</body>
</html>
