[pytest]
# 为什么需要这一行（2026-10-16 实测，CI 首次跑的真实失败原因）：
#
# 用 `python -m pytest` 调用时，Python 会把当前目录加进 sys.path，所以
# tests/ 里的 `from utils import ...`、`from modules import ...` 都能解析；
# 但用裸 `pytest` 调用时**不会**，于是收集阶段直接报
# ModuleNotFoundError: No module named 'utils' / 'modules' / 'gui'。
#
# 本地开发习惯了 `python -m pytest`，而 CI 的 workflow 写的是裸 `pytest`，
# 两边行为不一致 —— 本地全绿、CI 全红。pythonpath 是 pytest 7+ 的内置配置
# （不需要额外插件），显式声明后项目根始终在 sys.path 上，
# 无论 CI、命令行还是 IDE 用哪种方式触发，结果都一致。
pythonpath = .
