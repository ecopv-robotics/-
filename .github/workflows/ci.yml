# 本仓库是「邮件 & 系统漏单审核机器人」的源码仓库（public）。
# 任何推送到 main 的提交都会触发以下检查，必须全绿才算通过代码审查。
#
# 依赖策略说明：这里刻意不装 requirements.txt 全量依赖。
# paddlepaddle + paddleocr 体积数百 MB，且在本项目里是
# utils/attachment_parser.py 内的懒加载依赖（仅 OCR 兜底时才用），
# CI 装它们只会拖慢流水线，对测试无贡献。
# 下面的清单 = 所有模块级第三方 import 的并集（含几个可能被测试
# 触发的懒加载依赖）。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小权限：CI 只需要读代码
permissions:
  contents: read

# 同一分支的重复推送取消旧运行，避免排队
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: 单元与契约测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PyQt5 在无头 Linux 上需要这些系统库，否则 import 就失败
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      # 注意：这里刻意不装 requirements.txt 全量依赖。
      # paddlepaddle + paddleocr 体积数百 MB，且在本项目里是
      # utils/attachment_parser.py 内的懒加载依赖（仅 OCR 兜底时才用），
      # CI 装它们只会拖慢流水线，对测试无贡献。
      # 下面的清单 = 所有模块级第三方 import 的并集（含几个可能被测试
      # 触发的懒加载依赖）。
      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install \
            pytest \
            PyQt5 \
            PyYAML \
            openpyxl \
            beautifulsoup4 \
            openai \
            opencc-python-reimplemented \
            pydantic \
            rapidfuzz \
            imap-tools \
            pdfplumber \
            python-docx \
            rarfile \
            xlrd \
            pycryptodome

      # QT_QPA_PLATFORM=offscreen：无显示服务器时让 PyQt5 正常工作
      - name: 运行测试
        env:
          QT_QPA_PLATFORM: offscreen
        # 用 python -m pytest 而不是裸 pytest：前者会把当前目录（项目根）加入
        # sys.path。虽然 pytest.ini 里的 pythonpath=. 已经兜住了这件事，
        # 这里仍与本地推送脚本保持同一种调用方式，避免两边行为再次分叉。
        run: python -m pytest tests/ -q

  browser:
    name: 浏览器交互测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML openpyxl beautifulsoup4 openai \
            opencc-python-reimplemented pydantic rapidfuzz imap-tools

      - name: 安装 Playwright 与 Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      # 服务与用例必须放在同一个 step：GitHub Actions 每个 step 是独立 shell，
      # 后台进程跨 step 不保证存活。
      # 用 workbench_launcher 而非 web_app：前者不需要 PyQt5 事件循环，
      # 更适合无头环境。
      - name: 启动服务并运行浏览器用例
        env:
          # 只写一份：GitHub Actions 的环境变量名大小写不敏感，
          # 同时写 NO_PROXY 和 no_proxy 会被判为重复 key 而报
          # "Invalid workflow file: 'no_proxy' is already defined"。
          # Linux 下 NO_PROXY 即生效，无需再写小写别名。
          NO_PROXY: "localhost,127.0.0.1"
        run: |
          set -o pipefail
          python workbench_launcher.py --port 8765 --no-browser > /tmp/workbench.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 40); do
            if curl -sf --noproxy '*' http://127.0.0.1:8765/ > /dev/null; then
              echo "工作台服务已就绪（第 ${i} 秒）"
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            echo "::error::工作台服务未能在 40 秒内就绪"
            echo "----- 服务日志 -----"
            cat /tmp/workbench.log || true
            exit 1
          fi

          node _run_browser_tests.js
